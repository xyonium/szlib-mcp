name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: unit tests (no network)
        run: python -m pytest tests/ -q
